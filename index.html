<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4e6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quiz Revisione">
  <meta name="robots" content="noindex, nofollow">
  <title>Quiz Revisione Legale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone/icona-192.png">
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header class="barra">
    <button class="btn-icona" id="btnIndietro" aria-label="Indietro" hidden>&#8249;</button>
    <h1 class="titolo" id="titolo">Quiz Revisione</h1>
    <span class="spazio"></span>
    <span class="stato-rete" id="statoRete" hidden>offline</span>
  </header>

  <main id="vista" class="contenuto">
    <div class="caricamento"><div class="spinner-border text-secondary"></div><p>Caricamento domande…</p></div>
  </main>

  <nav class="menu-basso" id="menuBasso">
    <a href="#/" data-voce="home"><span class="ico">&#9654;</span>Nuovo test</a>
    <a href="#/storico" data-voce="storico"><span class="ico">&#9776;</span>Storico</a>
    <a href="#/info" data-voce="info"><span class="ico">&#9432;</span>Info</a>
  </nav>

  <div class="toast-app" id="toast" role="status" aria-live="polite"></div>

  <dialog id="dialogo" class="dialogo">
    <p id="dialogoTesto"></p>
    <div class="d-flex gap-2 justify-content-end">
      <button class="btn btn-secondary" id="dialogoNo">Annulla</button>
      <button class="btn btn-primary" id="dialogoSi">Conferma</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
